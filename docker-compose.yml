services:
  postgres:
    image: postgres:17
    container_name: miescom-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miescom}
      POSTGRES_USER: ${POSTGRES_USER:-miescom_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miescom_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - miescom_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed-demo.sql:/docker-entrypoint-initdb.d/02-seed-demo.sql

volumes:
  miescom_pgdata: